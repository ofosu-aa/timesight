<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TimeSight — Offline</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0B0E14; color:#E9EDF6; font-family:-apple-system,system-ui,sans-serif; text-align:center; padding:24px; }
  .icon { width:56px; height:56px; border-radius:16px; margin:0 auto 16px;
    background:linear-gradient(135deg,#7DA2FF,#9F8CFF); display:flex; align-items:center; justify-content:center; font-size:26px; }
  h1 { font-size:22px; margin:0 0 8px; } p { color:#8B95AB; font-size:14px; line-height:1.5; max-width:280px; margin:0 auto; }
  button { margin-top:20px; background:linear-gradient(135deg,#7DA2FF,#9F8CFF); color:#0B0E14; border:none;
    padding:12px 24px; border-radius:12px; font-weight:600; font-size:15px; }
</style>
</head>
<body>
<div>
  <div class="icon">◷</div>
  <h1>You're offline</h1>
  <p>No connection right now. Your running timer keeps counting on-device — reconnect and everything syncs back up.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
